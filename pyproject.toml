[project]
name = "weekly-review"
version = "0.1.0"
description = "Task-leverage weekly digest from Claude Code transcripts + GitHub + git"
readme = "README.md"
authors = [
    { name = "Bryan Chan", email = "fryanpan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "pycrdt>=0.14.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
weekly-review = "weekly_review.cli:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
